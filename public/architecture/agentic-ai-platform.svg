<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%" font-family="Arial, Helvetica, sans-serif">
  <title>Governed Agentic AI Platform — architecture overview</title>
  <desc>
    Diagram of a governed agentic AI platform. Public core flow: Request/Task Intake,
    Role Routing &amp; Orchestration, Approval &amp; Policy Gates, Controlled Execution,
    Evaluation &amp; Auditability, backed by role routing, human approval, provider
    abstraction, deterministic evaluation, and CI. A broader private implementation
    (Planner, Coder, Reviewer, Tester, governance, audit lineage, model routing,
    operator workflows) sits alongside in-progress MCP integration work and planned
    platform direction (PostgreSQL durable workflow state, pause/persist/restart/resume,
    Docker runtime, expanded observability).
  </desc>

  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#76b8ff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#76b8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panelFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#131b2a"/>
      <stop offset="100%" stop-color="#0e141f"/>
    </linearGradient>

    <symbol id="dotFull" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="currentColor"/></symbol>
    <symbol id="dotDiamond" viewBox="0 0 10 10"><rect x="1.6" y="1.6" width="6.8" height="6.8" fill="currentColor" transform="rotate(45 5 5)"/></symbol>
    <symbol id="dotHalf" viewBox="0 0 10 10">
      <circle cx="5" cy="5" r="4" fill="none" stroke="currentColor" stroke-width="1.3"/>
      <path d="M5 1.3A3.7 3.7 0 0 1 5 8.7z" fill="currentColor"/>
    </symbol>
    <symbol id="dotRing" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="none" stroke="currentColor" stroke-width="1.4"/></symbol>

    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#77f0e6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="700" fill="#070a10"/>
  <rect x="0" y="0" width="1200" height="260" fill="url(#glow)"/>

  <!-- Header -->
  <rect x="40" y="34" width="4" height="46" fill="#76b8ff"/>
  <text x="58" y="60" font-size="25" font-weight="700" fill="#f4f8ff">Governed Agentic AI Platform</text>
  <text x="58" y="82" font-size="14" fill="#98a8bd">Orchestration &#183; Approval &#183; Controlled Execution &#183; Evaluation</text>

  <!-- Legend -->
  <g font-size="12" fill="#98a8bd">
    <use href="#dotFull" x="700" y="41" width="10" height="10" color="#77f0e6"/>
    <text x="716" y="50">PUBLIC</text>

    <use href="#dotDiamond" x="792" y="41" width="10" height="10" color="#b795ff"/>
    <text x="808" y="50">PRIVATE</text>

    <use href="#dotHalf" x="889" y="41" width="10" height="10" color="#76b8ff"/>
    <text x="905" y="50">IN PROGRESS</text>

    <use href="#dotRing" x="1013" y="41" width="10" height="10" color="#7c8aa0"/>
    <text x="1029" y="50">PLANNED</text>
  </g>
  <line x1="40" y1="98" x2="1160" y2="98" stroke="#1c2740" stroke-width="1"/>

  <!-- Section label: core flow -->
  <use href="#dotFull" x="40" y="132" width="11" height="11" color="#77f0e6"/>
  <text x="58" y="141" font-size="13" font-weight="700" fill="#77f0e6" letter-spacing="0.4">PUBLIC &#8212; CORE EXECUTION FLOW</text>

  <!-- Main flow nodes -->
  <g>
    <!-- connectors -->
    <line x1="240" y1="212" x2="266" y2="212" stroke="#77f0e6" stroke-width="1.6" marker-end="url(#arrowTeal)"/>
    <line x1="470" y1="212" x2="496" y2="212" stroke="#77f0e6" stroke-width="1.6" marker-end="url(#arrowTeal)"/>
    <line x1="700" y1="212" x2="726" y2="212" stroke="#77f0e6" stroke-width="1.6" marker-end="url(#arrowTeal)"/>
    <line x1="930" y1="212" x2="956" y2="212" stroke="#77f0e6" stroke-width="1.6" marker-end="url(#arrowTeal)"/>
  </g>

  <g font-size="14" fill="#f4f8ff">
    <!-- Node 1 -->
    <rect x="40" y="165" width="200" height="95" rx="10" fill="url(#panelFill)" stroke="#2a3a56" stroke-width="1.2"/>
    <circle cx="58" cy="183" r="11" fill="#0e141f" stroke="#77f0e6" stroke-width="1.2"/>
    <text x="58" y="187" font-size="11" text-anchor="middle" fill="#77f0e6">1</text>
    <text x="140" y="215" text-anchor="middle">Request /</text>
    <text x="140" y="233" text-anchor="middle">Task Intake</text>

    <!-- Node 2 -->
    <rect x="270" y="165" width="200" height="95" rx="10" fill="url(#panelFill)" stroke="#2a3a56" stroke-width="1.2"/>
    <circle cx="288" cy="183" r="11" fill="#0e141f" stroke="#77f0e6" stroke-width="1.2"/>
    <text x="288" y="187" font-size="11" text-anchor="middle" fill="#77f0e6">2</text>
    <text x="370" y="215" text-anchor="middle">Role Routing &amp;</text>
    <text x="370" y="233" text-anchor="middle">Orchestration</text>

    <!-- Node 3 -->
    <rect x="500" y="165" width="200" height="95" rx="10" fill="url(#panelFill)" stroke="#2a3a56" stroke-width="1.2"/>
    <circle cx="518" cy="183" r="11" fill="#0e141f" stroke="#77f0e6" stroke-width="1.2"/>
    <text x="518" y="187" font-size="11" text-anchor="middle" fill="#77f0e6">3</text>
    <text x="600" y="215" text-anchor="middle">Approval &amp;</text>
    <text x="600" y="233" text-anchor="middle">Policy Gates</text>

    <!-- Node 4 -->
    <rect x="730" y="165" width="200" height="95" rx="10" fill="url(#panelFill)" stroke="#2a3a56" stroke-width="1.2"/>
    <circle cx="748" cy="183" r="11" fill="#0e141f" stroke="#77f0e6" stroke-width="1.2"/>
    <text x="748" y="187" font-size="11" text-anchor="middle" fill="#77f0e6">4</text>
    <text x="830" y="215" text-anchor="middle">Controlled</text>
    <text x="830" y="233" text-anchor="middle">Execution</text>

    <!-- Node 5 -->
    <rect x="960" y="165" width="200" height="95" rx="10" fill="url(#panelFill)" stroke="#2a3a56" stroke-width="1.2"/>
    <circle cx="978" cy="183" r="11" fill="#0e141f" stroke="#77f0e6" stroke-width="1.2"/>
    <text x="978" y="187" font-size="11" text-anchor="middle" fill="#77f0e6">5</text>
    <text x="1060" y="215" text-anchor="middle">Evaluation &amp;</text>
    <text x="1060" y="233" text-anchor="middle">Auditability</text>
  </g>

  <!-- Supporting public concepts -->
  <text x="40" y="292" font-size="12" font-weight="700" fill="#98a8bd" letter-spacing="0.3">SUPPORTING PUBLIC CONCEPTS</text>
  <g font-size="12" fill="#dce6f5">
    <rect x="110" y="300" width="140" height="30" rx="15" fill="#0e141f" stroke="#2f6f6b" stroke-width="1"/>
    <text x="180" y="319" text-anchor="middle">Role routing</text>

    <rect x="270" y="300" width="260" height="30" rx="15" fill="#0e141f" stroke="#2f6f6b" stroke-width="1"/>
    <text x="400" y="319" text-anchor="middle">Human approval / risk controls</text>

    <rect x="550" y="300" width="180" height="30" rx="15" fill="#0e141f" stroke="#2f6f6b" stroke-width="1"/>
    <text x="640" y="319" text-anchor="middle">Provider abstraction</text>

    <rect x="750" y="300" width="200" height="30" rx="15" fill="#0e141f" stroke="#2f6f6b" stroke-width="1"/>
    <text x="850" y="319" text-anchor="middle">Deterministic evaluation</text>

    <rect x="970" y="300" width="120" height="30" rx="15" fill="#0e141f" stroke="#2f6f6b" stroke-width="1"/>
    <text x="1030" y="319" text-anchor="middle">Testing / CI</text>
  </g>

  <!-- Zone panels -->
  <g>
    <!-- PRIVATE -->
    <rect x="40" y="372" width="360" height="300" rx="12" fill="#0e141f" stroke="#4a3d78" stroke-width="1.2"/>
    <use href="#dotDiamond" x="60" y="392" width="12" height="12" color="#b795ff"/>
    <text x="80" y="402" font-size="13" font-weight="700" fill="#b795ff" letter-spacing="0.3">PRIVATE</text>
    <text x="60" y="422" font-size="12" fill="#98a8bd">Broader agent implementation (separate repository)</text>
    <g font-size="12.5" fill="#dce6f5">
      <text x="60" y="452">&#8211; Planner</text>
      <text x="60" y="479">&#8211; Coder</text>
      <text x="60" y="506">&#8211; Reviewer</text>
      <text x="60" y="533">&#8211; Tester</text>
      <text x="60" y="560">&#8211; Governance / policy gates</text>
      <text x="60" y="587">&#8211; Audit lineage</text>
      <text x="60" y="614">&#8211; Model routing</text>
      <text x="60" y="641">&#8211; Broader operator workflows</text>
    </g>

    <!-- IN PROGRESS -->
    <rect x="420" y="372" width="360" height="300" rx="12" fill="#0e141f" stroke="#2b4f78" stroke-width="1.2"/>
    <use href="#dotHalf" x="440" y="392" width="12" height="12" color="#76b8ff"/>
    <text x="460" y="402" font-size="13" font-weight="700" fill="#76b8ff" letter-spacing="0.3">IN PROGRESS</text>
    <text x="440" y="422" font-size="12" fill="#98a8bd">MCP integration foundation</text>
    <g font-size="12.5" fill="#dce6f5">
      <text x="440" y="452">&#8211; MCP client/server foundation</text>
      <text x="440" y="479">&#8211; MCP discovery &amp; schema handling</text>
      <text x="440" y="506">&#8211; Authorized MCP invocation</text>
    </g>
    <text x="440" y="540" font-size="11.5" fill="#7c8aa0">Active development; not yet a</text>
    <text x="440" y="558" font-size="11.5" fill="#7c8aa0">complete end-to-end path.</text>

    <!-- PLANNED -->
    <rect x="800" y="372" width="360" height="300" rx="12" fill="#0e141f" stroke="#33445e" stroke-width="1.2" stroke-dasharray="5 4"/>
    <use href="#dotRing" x="820" y="392" width="12" height="12" color="#7c8aa0"/>
    <text x="840" y="402" font-size="13" font-weight="700" fill="#9fb0c8" letter-spacing="0.3">PLANNED</text>
    <text x="820" y="422" font-size="12" fill="#98a8bd">Platform direction</text>
    <g font-size="12.5" fill="#c3cedd">
      <text x="820" y="452">&#8211; PostgreSQL durable workflow state</text>
      <text x="820" y="479">&#8211; Pause / persist / restart / resume</text>
      <text x="820" y="506">&#8211; Docker runtime</text>
      <text x="820" y="533">&#8211; Expanded observability</text>
    </g>
    <text x="820" y="567" font-size="11.5" fill="#7c8aa0">Roadmap only &#8212; not yet</text>
    <text x="820" y="585" font-size="11.5" fill="#7c8aa0">implemented.</text>
  </g>
</svg>
