<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%" font-family="Arial, Helvetica, sans-serif">
  <title>Evidence-Centered Regulated AI — architecture overview</title>
  <desc>
    Diagram of an evidence-centered regulated AI platform. Public core flow: Document/
    Evidence Inputs, Evidence &amp; Citation Contracts, Grounded/Structured Output, Human
    Review, Traceability &amp; Evaluation, backed by stable citation identity, retrieval-
    evidence contracts, grounded-answer contracts, structured-summary contracts, trace
    IDs, review transitions, and CI. Retrieval, reranking, and document-intelligence
    capabilities (dense/lexical/hybrid retrieval, metadata filtering, reranking,
    retrieval and citation evaluation, governance expansion) are shown as planned
    platform direction, not implemented in the public repository.
  </desc>

  <defs>
    <radialGradient id="glow2" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#77f0e6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#77f0e6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panelFill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#131b2a"/>
      <stop offset="100%" stop-color="#0e141f"/>
    </linearGradient>

    <symbol id="dotFull2" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="currentColor"/></symbol>
    <symbol id="dotDiamond2" viewBox="0 0 10 10"><rect x="1.6" y="1.6" width="6.8" height="6.8" fill="currentColor" transform="rotate(45 5 5)"/></symbol>
    <symbol id="dotHalf2" viewBox="0 0 10 10">
      <circle cx="5" cy="5" r="4" fill="none" stroke="currentColor" stroke-width="1.3"/>
      <path d="M5 1.3A3.7 3.7 0 0 1 5 8.7z" fill="currentColor"/>
    </symbol>
    <symbol id="dotRing2" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="none" stroke="currentColor" stroke-width="1.4"/></symbol>

    <marker id="arrowTeal2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#77f0e6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="700" fill="#070a10"/>
  <rect x="0" y="0" width="1200" height="260" fill="url(#glow2)"/>

  <!-- Header -->
  <rect x="40" y="34" width="4" height="46" fill="#77f0e6"/>
  <text x="58" y="60" font-size="25" font-weight="700" fill="#f4f8ff">Evidence-Centered Regulated AI</text>
  <text x="58" y="82" font-size="14" fill="#98a8bd">Evidence &#183; Grounding &#183; Review &#183; Traceability</text>

  <!-- Legend -->
  <g font-size="12" fill="#98a8bd">
    <use href="#dotFull2" x="700" y="41" width="10" height="10" color="#77f0e6"/>
    <text x="716" y="50">PUBLIC</text>

    <use href="#dotDiamond2" x="792" y="41" width="10" height="10" color="#b795ff"/>
    <text x="808" y="50">PRIVATE</text>

    <use href="#dotHalf2" x="889" y="41" width="10" height="10" color="#76b8ff"/>
    <text x="905" y="50">IN PROGRESS</text>

    <use href="#dotRing2" x="1013" y="41" width="10" height="10" color="#7c8aa0"/>
    <text x="1029" y="50">PLANNED</text>
  </g>
  <line x1="40" y1="98" x2="1160" y2="98" stroke="#1c2740" stroke-width="1"/>

  <!-- Section label: core flow -->
  <use href="#dotFull2" x="40" y="132" width="11" height="11" color="#77f0e6"/>
  <text x="58" y="141" font-size="13" font-weight="700" fill="#77f0e6" letter-spacing="0.4">PUBLIC &#8212; CORE EVIDENCE FLOW</text>

  <!-- Main flow nodes -->
  <g>
    <line x1="240" y1="212" x2="266" y2="212" stroke="#77f0e6" stroke-width="1.6" marker-end="url(#arrowTeal2)"/>
    <line x1="470" y1="212" x2="496" y2="212" stroke="#77f0e6" stroke-width="1.6" marker-end="url(#arrowTeal2)"/>
    <line x1="700" y1="212" x2="726" y2="212" stroke="#77f0e6" stroke-width="1.6" marker-end="url(#arrowTeal2)"/>
    <line x1="930" y1="212" x2="956" y2="212" stroke="#77f0e6" stroke-width="1.6" marker-end="url(#arrowTeal2)"/>
  </g>

  <g font-size="14" fill="#f4f8ff">
    <!-- Node 1 -->
    <rect x="40" y="165" width="200" height="95" rx="10" fill="url(#panelFill2)" stroke="#2a3a56" stroke-width="1.2"/>
    <circle cx="58" cy="183" r="11" fill="#0e141f" stroke="#77f0e6" stroke-width="1.2"/>
    <text x="58" y="187" font-size="11" text-anchor="middle" fill="#77f0e6">1</text>
    <text x="140" y="215" text-anchor="middle">Document /</text>
    <text x="140" y="233" text-anchor="middle">Evidence Inputs</text>

    <!-- Node 2 -->
    <rect x="270" y="165" width="200" height="95" rx="10" fill="url(#panelFill2)" stroke="#2a3a56" stroke-width="1.2"/>
    <circle cx="288" cy="183" r="11" fill="#0e141f" stroke="#77f0e6" stroke-width="1.2"/>
    <text x="288" y="187" font-size="11" text-anchor="middle" fill="#77f0e6">2</text>
    <text x="370" y="215" text-anchor="middle">Evidence &amp;</text>
    <text x="370" y="233" text-anchor="middle">Citation Contracts</text>

    <!-- Node 3 -->
    <rect x="500" y="165" width="200" height="95" rx="10" fill="url(#panelFill2)" stroke="#2a3a56" stroke-width="1.2"/>
    <circle cx="518" cy="183" r="11" fill="#0e141f" stroke="#77f0e6" stroke-width="1.2"/>
    <text x="518" y="187" font-size="11" text-anchor="middle" fill="#77f0e6">3</text>
    <text x="600" y="215" text-anchor="middle">Grounded /</text>
    <text x="600" y="233" text-anchor="middle">Structured Output</text>

    <!-- Node 4 -->
    <rect x="730" y="165" width="200" height="95" rx="10" fill="url(#panelFill2)" stroke="#2a3a56" stroke-width="1.2"/>
    <circle cx="748" cy="183" r="11" fill="#0e141f" stroke="#77f0e6" stroke-width="1.2"/>
    <text x="748" y="187" font-size="11" text-anchor="middle" fill="#77f0e6">4</text>
    <text x="830" y="215" text-anchor="middle">Human</text>
    <text x="830" y="233" text-anchor="middle">Review</text>

    <!-- Node 5 -->
    <rect x="960" y="165" width="200" height="95" rx="10" fill="url(#panelFill2)" stroke="#2a3a56" stroke-width="1.2"/>
    <circle cx="978" cy="183" r="11" fill="#0e141f" stroke="#77f0e6" stroke-width="1.2"/>
    <text x="978" y="187" font-size="11" text-anchor="middle" fill="#77f0e6">5</text>
    <text x="1060" y="215" text-anchor="middle">Traceability &amp;</text>
    <text x="1060" y="233" text-anchor="middle">Evaluation</text>
  </g>

  <!-- Supporting public concepts -->
  <text x="40" y="292" font-size="12" font-weight="700" fill="#98a8bd" letter-spacing="0.3">SUPPORTING PUBLIC CONCEPTS</text>
  <g font-size="12" fill="#dce6f5">
    <rect x="130" y="300" width="200" height="30" rx="15" fill="#0e141f" stroke="#2f6f6b" stroke-width="1"/>
    <text x="230" y="319" text-anchor="middle">Stable citation identity</text>

    <rect x="350" y="300" width="230" height="30" rx="15" fill="#0e141f" stroke="#2f6f6b" stroke-width="1"/>
    <text x="465" y="319" text-anchor="middle">Retrieval-evidence contracts</text>

    <rect x="600" y="300" width="220" height="30" rx="15" fill="#0e141f" stroke="#2f6f6b" stroke-width="1"/>
    <text x="710" y="319" text-anchor="middle">Grounded-answer contracts</text>

    <rect x="840" y="300" width="230" height="30" rx="15" fill="#0e141f" stroke="#2f6f6b" stroke-width="1"/>
    <text x="955" y="319" text-anchor="middle">Structured-summary contracts</text>

    <rect x="395" y="338" width="100" height="30" rx="15" fill="#0e141f" stroke="#2f6f6b" stroke-width="1"/>
    <text x="445" y="357" text-anchor="middle">Trace IDs</text>

    <rect x="515" y="338" width="170" height="30" rx="15" fill="#0e141f" stroke="#2f6f6b" stroke-width="1"/>
    <text x="600" y="357" text-anchor="middle">Review transitions</text>

    <rect x="705" y="338" width="100" height="30" rx="15" fill="#0e141f" stroke="#2f6f6b" stroke-width="1"/>
    <text x="755" y="357" text-anchor="middle">Tests / CI</text>
  </g>

  <!-- Platform direction (planned) -->
  <rect x="40" y="384" width="1120" height="260" rx="12" fill="#0e141f" stroke="#33445e" stroke-width="1.2" stroke-dasharray="5 4"/>
  <use href="#dotRing2" x="60" y="404" width="12" height="12" color="#7c8aa0"/>
  <text x="80" y="414" font-size="13" font-weight="700" fill="#9fb0c8" letter-spacing="0.3">PLANNED</text>
  <text x="60" y="434" font-size="12" fill="#98a8bd">Retrieval &amp; document-intelligence direction &#8212; not implemented in the public repository</text>

  <g font-size="12.5" fill="#c3cedd">
    <text x="70" y="466">&#8211; Document intelligence</text>
    <text x="70" y="500">&#8211; Version-aware preparation</text>
    <text x="70" y="534">&#8211; Dense / lexical / hybrid retrieval</text>
    <text x="70" y="568">&#8211; Metadata filtering</text>

    <text x="620" y="466">&#8211; Reranking</text>
    <text x="620" y="500">&#8211; Retrieval evaluation</text>
    <text x="620" y="534">&#8211; Citation evaluation</text>
    <text x="620" y="568">&#8211; Governance expansion</text>
  </g>
  <line x1="70" y1="452" x2="1090" y2="452" stroke="#22304a" stroke-width="1"/>
</svg>
